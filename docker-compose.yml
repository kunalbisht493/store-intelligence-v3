version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: store-intelligence-api

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info

      DB_PATH: /app/data/store.db
      EVENTS_OUTPUT: /app/data/events.jsonl

      STORE1_ID: ST1008
      STORE1_LAYOUT: /app/data/store_layout_ST1008.json
      STORE1_POS: /app/data/store1/pos_transactions.csv

      STORE2_ID: ST1076
      STORE2_LAYOUT: /app/data/store_layout_ST1076.json
      STORE2_POS: /app/data/store2/pos_transactions.csv

      YOLO_MODEL_PATH: /app/models/yolov8n.onnx

    volumes:
      - ./data:/app/data
      - ./clips:/app/clips
      - ./models:/app/models

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

